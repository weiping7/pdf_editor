# 每次推送到 main 分支，自动测试、构建并发布到 GitHub Pages。
# 第一次使用前：仓库 Settings → Pages → Build and deployment → Source 选 “GitHub Actions”。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 也可以在 Actions 页面手动运行

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只发布一次；新的推送会排队，不会打断正在进行的发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
